name: helijump

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helijump}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helijump}
      POSTGRES_DB: ${POSTGRES_DB:-helijump}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helijump}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- optional local-only dev tools (docker compose --profile dev up) ---
  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy

  # --- application services (docker compose --profile app up) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-helijump}:${POSTGRES_PASSWORD:-helijump}@postgres:5432/${POSTGRES_DB:-helijump}
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off: `docker compose --profile app run --rm migrate`. Targets the
  # `builder` stage (same reason as worker/ws below) — the final `runner`
  # image is a minimal standalone Next.js output with no `prisma` CLI
  # package in it, so `npx prisma` there falls back to downloading whatever
  # the latest version on the registry is instead of the project's pinned
  # one, which breaks (schema format changes between major versions).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-helijump}:${POSTGRES_PASSWORD:-helijump}@postgres:5432/${POSTGRES_DB:-helijump}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "tsx", "scripts/worker.ts"]
    restart: unless-stopped
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-helijump}:${POSTGRES_PASSWORD:-helijump}@postgres:5432/${POSTGRES_DB:-helijump}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npx", "tsx", "scripts/ws-server.ts"]
    restart: unless-stopped
    profiles: ["app"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
