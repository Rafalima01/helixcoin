name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # Services are provisioned for when Phase 3+ adds real integration tests
    # against Postgres/Redis. The current Phase 2 suite runs against
    # in-memory fakes (see tests/helpers) and does not require them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helijump
          POSTGRES_PASSWORD: helijump
          POSTGRES_DB: helijump_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helijump"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run test -- --coverage
        env:
          DATABASE_URL: postgresql://helijump:helijump@localhost:5432/helijump_test
          REDIS_URL: redis://localhost:6379

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          # Build-time placeholder — no live DB required to compile Route
          # Handlers, only to execute them at runtime.
          DATABASE_URL: postgresql://helijump:helijump@localhost:5432/helijump_build
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: build-placeholder-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
          JWT_ACCESS_SECRET: build-placeholder-access-secret
          JWT_REFRESH_SECRET: build-placeholder-refresh-secret
          ENCRYPTION_KEY: build-placeholder-encryption-key-not-real
